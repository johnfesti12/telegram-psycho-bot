version: "3.8"
services:
  postgres:
    image: postgres:15
    container_name: psycho_bot_postgres
    environment:
      POSTGRES_DB: psycho_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_init:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4
    container_name: psycho_bot_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@psychobot.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
